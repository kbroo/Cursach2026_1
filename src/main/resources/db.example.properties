# This is file example for database properties
# You must replace values and rename file into db.properties

# Url for connection to db
# Replace "database_name" with your value
# You can also replace port (3306) in case you use some different
db.url=jdbc:mysql://localhost:3306/database_name?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
# Username for db connection
db.user=user_name
# Database password
db.password=password
# Driver class (you can use different)
db.driver=com.mysql.cj.jdbc.Driver